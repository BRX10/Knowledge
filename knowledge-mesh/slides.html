<script>
(function(){
  var S=[["AI agents at scale", "Why AI agents may fail at scale.", ["Not for lack of models. Trust requires understanding what an agent relies on: its context."], "", "So what is that context made of?"], ["Context", "From prompt engineering to context engineering.", ["An answer depends on its context more than on the model. Context is drawn from data and knowledge. AI programmes often govern only data."], "", "An old problem, with a new reader"], ["The gap", "A colleague could ask around. An agent cannot.", ["What is not made accessible, it will never know."], "", "And retrieval alone does not close the gap"], ["Grounding", "Grounding: raw or organised?", ["Both can ground an agent. RAG reassembles raw documents at every question. A wiki organises them once, upstream."], "", "Compiling knowledge starts with one separation"], ["Principle zero", "Managing knowledge is one job. Consuming it is another.", [], "One effort upstream. Every use downstream.", "On that separation, a model: the Knowledge Mesh"], ["The Knowledge Mesh", "Five principles for a Knowledge Mesh.", [], "", "Who does the work? People and agents, together"], ["Who decides", "Agents handle the clear cases, people the doubt.", ["The owner does not reread everything. They arbitrate the exceptions."], "Every change is traced, and reversible.", "One owner per base. So, many bases"], ["The mesh", "Accept fragmentation, and organise it.", ["Each domain owns its bases. Shared standards let people and agents draw on the same governed context.", "Dehghani: an intentionally designed distribution, not a landscape of silos (2019)."], "Centralise the means, decentralise the knowledge.", "And every base lives, then dies"], ["Save this", "Knowledge is born, lives and sometimes dies.", [], "Living knowledge must be allowed to die.", "One last thing"], ["The Knowledge Mesh", "A Knowledge Mesh could be an enabler of AI at scale.", ["What makes knowledge trustworthy enough for your agents to act on?"], "", "END"], ["About the author", "Benoit Rousseaux", ["AI practitioner since 2017.", "Interested in new technologies and in how people make them their own, to create use, impact and meaning. First on industrial performance programmes built on machine learning, then on the way generative AI changes uses and organisations."], "", "AUTHOR"]], A=["An AI agent and its tools take actions and decisions on top of context engineering, which rests on two pillars: data, what the company records, and knowledge, what it means.", "From a prompt written by hand to a context assembled for each task, drawn from governed data and from knowledge, often a side issue.", "Quote: If only HP knew what HP knows, we would be three times more productive. Lew Platt, CEO of Hewlett-Packard, 1990s (attributed). An iceberg: what is written is what the agent sees; what is tacit, held by people, stays below.", "RAG reassembles raw documents at every question; a wiki is organised once: sourced, owned, dated. Quote from Andrej Karpathy, LLM Wiki (2026): the knowledge is compiled once and then kept current, not re-derived on every query.", "Managing (build, validate, keep alive, retire; deliberate, dated, in markdown) feeds consuming (answer, assist, act; people and agents; instant) through MCP or an API; gaps and errors flow back.", "Five principles: 1 domain ownership, 2 self-describing product, 3 self-serve platform, 4 federated governance, 5 auditable construction. Inspired by Zhamak Dehghani's Data Mesh.", "Documents, interviews and decisions: agents draft against a charter; clear-cut cases go to the wiki; doubt goes to the Knowledge Owner, who arbitrates and commits.", "Domains HR, Legal, Finance and others, each owning its bases, linked by shared standards.", "Six stages: capture, consolidate, validate, serve, review, retire, shared between agents and the owner.", "A knowledge base and its parts: Knowledge Owner, sources, pages, charter, contract, domain, states. Quote: Mieux vaut une tete bien faite qu'une tete bien pleine, after Montaigne."];
  var st=document.getElementById('stage'), dots=document.getElementById('dots'), cnt=document.getElementById('cnt'), e=SITEKIT.esc, i=0;
  function pad(n){return (n<10?'0':'')+n;}
  S.forEach(function(_,k){var b=document.createElement('button');b.setAttribute('aria-label','Slide '+(k+1));b.onclick=function(){go(k);};dots.appendChild(b);});
  function go(k){
    i=(k+S.length)%S.length; var s=S[i];
    var t='<div><div class="sk"><span>'+e(s[0])+'</span></div><h2>'+e(s[1])+'</h2>'+s[2].map(function(p){return '<p>'+e(p)+'</p>';}).join('')+(s[3]?'<p class="hl">'+e(s[3])+'</p>':'');
    if(s[4]==='AUTHOR'){ t+='<div class="end"><a class="btn btn-primary" data-linkedin href="https://www.linkedin.com/in/benoitrousseaux/" target="_blank" rel="noopener">Connect on LinkedIn</a></div><p class="colo-s">The Knowledge Mesh Playbook · Version 2.5 · 16 November 2026</p></div><div class="art"><span class="au-ph"><img src="'+SITEKIT.img('portrait')+'" alt="Sketch portrait of Benoit Rousseaux"></span></div>'; }
    else if(s[4]==='END') t+='<div class="end"><a class="btn btn-primary" href="playbook.html">Read the full playbook</a><a class="btn" href="../#downloads">Downloads</a></div>';
    else t+='<p class="nx">'+e(s[4])+'</p>';
    if(s[4]!=='AUTHOR') t+='</div><div class="art"><img src="'+SITEKIT.img('slide-'+pad(i+1))+'" alt="'+e(A[i])+'"></div>';
    st.innerHTML='<div class="slide" role="group" aria-roledescription="slide" aria-label="'+(i+1)+' of '+S.length+'">'+t+'</div>';
    cnt.textContent=pad(i+1)+' / '+pad(S.length);
    [].forEach.call(dots.children,function(d,j){d.setAttribute('aria-current',j===i?'true':'false');});
    if(history.replaceState) history.replaceState(null,'','#'+(i+1));
  }
  document.getElementById('prev').onclick=function(){go(i-1);};
  document.getElementById('next').onclick=function(){go(i+1);};
  document.addEventListener('keydown',function(ev){ if(ev.target.closest&&ev.target.closest('input,textarea'))return; if(ev.key==='ArrowRight')go(i+1); if(ev.key==='ArrowLeft')go(i-1); });
  var x0=null; st.addEventListener('touchstart',function(ev){x0=ev.touches[0].clientX;},{passive:true});
  st.addEventListener('touchend',function(ev){ if(x0===null)return; var dx=ev.changedTouches[0].clientX-x0; if(Math.abs(dx)>50) go(i+(dx<0?1:-1)); x0=null; });
  var h=parseInt(location.hash.slice(1),10); go(h>=1&&h<=S.length?h-1:0);
  for(var k=1;k<=10;k++){ var p=new Image(); p.src=SITEKIT.img('slide-'+pad(k)); }
})();
</script>
